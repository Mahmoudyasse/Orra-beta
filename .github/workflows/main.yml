name: Build APK
concurrency:
  group: orra-beta-build
  cancel-in-progress: true
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply update zip (if present)
        run: |
          if [ -f Orra-beta-settings-update.zip ]; then
            rm -rf /tmp/up && mkdir /tmp/up
            unzip -o Orra-beta-settings-update.zip -d /tmp/up
            rm -rf /tmp/up/*/.github
            cp -r /tmp/up/*/. .
            rm Orra-beta-settings-update.zip
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Apply ORRA settings update" || true
            git push || true
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Orra-build-diagnostics
          path: build.log
          if-no-files-found: ignore
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Orra-beta-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
